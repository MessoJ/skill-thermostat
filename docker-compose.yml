services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8001}:8001"
    environment:
      - RUNNER_URL=http://runner:9000
      - RUNNER_KEY=${RUNNER_KEY:-local-dev-runner-secret}
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - HELPER_MODEL=${HELPER_MODEL:-}
    volumes:
      - study_data:/data
    depends_on:
      runner:
        condition: service_healthy
    networks:
      - public_net
      - sandbox_net
    restart: unless-stopped

  runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    environment:
      - RUNNER_KEY=${RUNNER_KEY:-local-dev-runner-secret}
      - RUNNER_SLOTS=4
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 512m
    cpus: 1.0
    networks:
      - sandbox_net
    restart: unless-stopped

networks:
  public_net:
    driver: bridge
  sandbox_net:
    driver: bridge
    internal: true

volumes:
  study_data:
